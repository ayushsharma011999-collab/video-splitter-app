name: Facebook Auto Poster - Sequential

on:
  workflow_dispatch:

  schedule:
    - cron: "3-59/5 * * * *"

concurrency:
  group: facebook-auto-poster
  cancel-in-progress: false

jobs:
  publish-next-video:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GET MICROSOFT GRAPH TOKEN
      # ============================================================
      - name: Get Microsoft Graph token
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -e

          echo "Getting Microsoft Graph token..."

          curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials" \
            -o graph_token_response.json

          python - <<'PY'
          import json

          with open("graph_token_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          token = data.get("access_token")

          if not token:
              print("ERROR: Microsoft Graph token was not returned.")
              print(data)
              raise SystemExit(1)

          with open("graph_token.txt", "w", encoding="utf-8") as f:
              f.write(token)

          print("Graph token obtained successfully.")
          PY

          echo "GRAPH_TOKEN=$(cat graph_token.txt)" >> "$GITHUB_ENV"


      # ============================================================
      # 2. LIST PENDING_POSTS
      # ============================================================
      - name: List Pending_Posts
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          echo "Checking Pending_Posts..."

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Pending_Posts:/children" \
            -o pending_list.json \
            -w "%{http_code}" \
            > pending_http_code.txt

          HTTP_CODE=$(cat pending_http_code.txt)

          echo "HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: Could not read Pending_Posts."
            cat pending_list.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("pending_list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          print("Items found:", len(items))

          for item in items:
              print(item.get("name", ""))
          PY


      # ============================================================
      # 3. SELECT NEXT VIDEO + MATCHING METADATA
      # ============================================================
      - name: Select next video and matching metadata
        run: |
          set -e

          python - <<'PY'
          import json
          import re

          with open("pending_list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          videos = []

          for item in items:
              name = item.get("name", "")

              if not name.lower().endswith(".mp4"):
                  continue

              match = re.search(
                  r"_clip_(\d+)\.mp4$",
                  name,
                  re.IGNORECASE
              )

              if match:
                  part_number = int(match.group(1))
              else:
                  part_number = 999999

              videos.append({
                  "item": item,
                  "part_number": part_number
              })

          if not videos:
              print("No pending MP4 videos found.")
              print("Nothing to post.")
              raise SystemExit(0)

          videos.sort(
              key=lambda x: (
                  x["item"].get("name", "").rsplit("_clip_", 1)[0],
                  x["part_number"],
                  x["item"].get("name", "")
              )
          )

          selected = videos[0]["item"]

          video_name = selected["name"]
          video_id = selected["id"]
          video_url = selected.get("@microsoft.graph.downloadUrl")

          if not video_url:
              print("ERROR: Video download URL not available.")
              raise SystemExit(1)

          print("Selected video:")
          print(video_name)

          print("Item ID:")
          print(video_id)

          # --------------------------------------------------------
          # Find source base name and current clip number
          # --------------------------------------------------------
          clip_match = re.match(
              r"^(.*)_clip_(\d+)\.mp4$",
              video_name,
              re.IGNORECASE
          )

          if clip_match:
              source_base = clip_match.group(1)
              current_part = int(clip_match.group(2))
          else:
              source_base = video_name.rsplit(".", 1)[0]
              current_part = 1

          metadata_name = source_base + "_metadata.json"

          print("Matching metadata:")
          print(metadata_name)

          metadata = None

          for item in items:
              if item.get("name", "").lower() == metadata_name.lower():
                  metadata = item
                  break

          if metadata is None:
              print("ERROR: Matching metadata file was not found.")
              print("Expected:", metadata_name)
              raise SystemExit(1)

          # --------------------------------------------------------
          # Count total clips for this source video
          # --------------------------------------------------------
          total_parts = 0

          for item in items:
              item_name = item.get("name", "")

              if (
                  item_name.lower().startswith(
                      source_base.lower() + "_clip_"
                  )
                  and item_name.lower().endswith(".mp4")
              ):
                  total_parts += 1

          print("Current part:", current_part)
          print("Total pending parts:", total_parts)

          # --------------------------------------------------------
          # Save selected information
          # --------------------------------------------------------
          with open(
              "selected_video.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(video_name)

          with open(
              "selected_item_id.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(video_id)

          with open(
              "selected_download_url.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(video_url)

          with open(
              "selected_metadata_name.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(metadata_name)

          with open(
              "selected_metadata_id.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(metadata["id"])

          with open(
              "current_part.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(str(current_part))

          with open(
              "total_parts.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(str(total_parts))

          with open(
              "metadata_download_url.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  metadata["@microsoft.graph.downloadUrl"]
              )
          PY


      # ============================================================
      # 4. DOWNLOAD MATCHING METADATA
      # ============================================================
      - name: Download matching metadata
        run: |
          set -e

          METADATA_URL=$(cat metadata_download_url.txt)

          echo "Downloading matching metadata..."

          curl -L --fail \
            "${METADATA_URL}" \
            -o metadata.json

          echo "Metadata downloaded."

          cat metadata.json


      # ============================================================
      # 5. BUILD CAPTION + CLIP NUMBER + TOP 5 HASHTAGS
      # ============================================================
      - name: Build caption and hashtags
        run: |
          set -e

          python - <<'PY'
          import json

          # --------------------------------------------------------
          # Read metadata
          # --------------------------------------------------------
          with open(
              "metadata.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          # --------------------------------------------------------
          # Caption
          # --------------------------------------------------------
          caption = data.get("caption", "")

          if not caption:
              caption = data.get("description", "")

          if not caption:
              caption = data.get("title", "")

          if not caption:
              caption = "New video"

          caption = str(caption).strip()

          # --------------------------------------------------------
          # Get hashtags
          # --------------------------------------------------------
          hashtags = data.get("hashtags", "")

          if not hashtags:
              hashtags = data.get("tags", "")

          # --------------------------------------------------------
          # Convert list to text
          # --------------------------------------------------------
          if isinstance(hashtags, list):
              hashtag_list = hashtags
          else:
              hashtag_list = str(hashtags).replace(",", " ").split()

          # --------------------------------------------------------
          # Clean hashtags
          # --------------------------------------------------------
          clean_hashtags = []

          for tag in hashtag_list:

              tag = str(tag).strip()

              if not tag:
                  continue

              # Remove existing #
              tag = tag.lstrip("#")

              # Remove spaces
              tag = tag.replace(" ", "")

              if not tag:
                  continue

              # Add #
              tag = "#" + tag

              # Avoid duplicates
              existing = [
                  x.lower()
                  for x in clean_hashtags
              ]

              if tag.lower() not in existing:
                  clean_hashtags.append(tag)

          # --------------------------------------------------------
          # DEFAULT HASHTAGS
          # --------------------------------------------------------
          if not clean_hashtags:
              clean_hashtags = [
                  "#viral",
                  "#trending",
                  "#shorts",
                  "#reels",
                  "#facebook"
              ]

          # --------------------------------------------------------
          # MAXIMUM TOP 5 CONTENT HASHTAGS
          # --------------------------------------------------------
          top_5_hashtags = clean_hashtags[:5]

          # --------------------------------------------------------
          # Read clip information
          # --------------------------------------------------------
          current_part = int(
              open(
                  "current_part.txt",
                  "r",
                  encoding="utf-8"
              ).read().strip()
          )

          total_parts = int(
              open(
                  "total_parts.txt",
                  "r",
                  encoding="utf-8"
              ).read().strip()
          )

          # --------------------------------------------------------
          # Clip text
          # --------------------------------------------------------
          clip_text = (
              f"🎬 Clip {current_part}/{total_parts}"
          )

          # --------------------------------------------------------
          # Clip hashtag
          # --------------------------------------------------------
          clip_hashtag = f"#Clip{current_part}"

          # --------------------------------------------------------
          # Final hashtag list
          #
          # Example:
          # #Clip1 #viral #trending #shorts #reels #facebook
          # --------------------------------------------------------
          final_hashtags = [
              clip_hashtag
          ] + top_5_hashtags

          hashtag_text = " ".join(
              final_hashtags
          )

          # --------------------------------------------------------
          # FINAL FACEBOOK CAPTION
          # --------------------------------------------------------
          final_caption = (
              clip_text
              + "\n\n"
              + caption
              + "\n\n"
              + hashtag_text
          )

          # --------------------------------------------------------
          # Show in GitHub log
          # --------------------------------------------------------
          print("")
          print("========================================")
          print("FINAL FACEBOOK CAPTION")
          print("========================================")
          print(final_caption)
          print("========================================")
          print("")
          print("Current Clip:", current_part)
          print("Total Clips:", total_parts)
          print("Content Hashtags:", len(top_5_hashtags))
          print("========================================")

          # --------------------------------------------------------
          # Save caption
          # --------------------------------------------------------
          with open(
              "post_caption.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(final_caption)
          PY


      # ============================================================
      # 6. DOWNLOAD SELECTED VIDEO
      # ============================================================
      - name: Download selected video
        run: |
          set -e

          VIDEO=$(cat selected_video.txt)
          VIDEO_URL=$(cat selected_download_url.txt)

          mkdir -p pending_files

          echo "Downloading selected video:"
          echo "${VIDEO}"

          curl -L --fail \
            "${VIDEO_URL}" \
            -o "pending_files/${VIDEO}"

          echo "Video downloaded."

          ls -lh "pending_files/${VIDEO}"


      # ============================================================
      # 7. CHECK FACEBOOK SECRETS
      # ============================================================
      - name: Check Facebook secrets
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          if [ -z "${FACEBOOK_PAGE_ID}" ]; then
            echo "ERROR: FACEBOOK_PAGE_ID secret is missing."
            exit 1
          fi

          if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN}" ]; then
            echo "ERROR: FACEBOOK_PAGE_ACCESS_TOKEN secret is missing."
            exit 1
          fi

          echo "Facebook secrets are available."


      # ============================================================
      # 8. PUBLISH NEXT CLIP TO FACEBOOK
      # ============================================================
      - name: Publish next part to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          VIDEO=$(cat selected_video.txt)
          CAPTION=$(cat post_caption.txt)

          echo "========================================"
          echo "Publishing next Facebook clip"
          echo "========================================"

          echo "Video:"
          echo "${VIDEO}"

          echo ""
          echo "Caption:"
          cat post_caption.txt

          echo ""
          echo "Uploading to Facebook..."

          curl -sS \
            -X POST \
            "https://graph.facebook.com/v23.0/${FACEBOOK_PAGE_ID}/videos" \
            -H "Authorization: Bearer ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            -F "source=@pending_files/${VIDEO}" \
            --form-string "description=${CAPTION}" \
            -o facebook_response.json \
            -w "%{http_code}" \
            > facebook_http_code.txt

          FACEBOOK_HTTP_CODE=$(cat facebook_http_code.txt)

          echo ""
          echo "Facebook HTTP Status: ${FACEBOOK_HTTP_CODE}"

          echo ""
          echo "Facebook response:"
          cat facebook_response.json

          if [ "${FACEBOOK_HTTP_CODE}" -lt 200 ] || [ "${FACEBOOK_HTTP_CODE}" -ge 300 ]; then
            echo ""
            echo "ERROR: Facebook upload failed."
            echo "The video will remain in Pending_Posts."
            exit 1
          fi

          python - <<'PY'
          import json

          with open(
              "facebook_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          video_id = data.get("id")

          if not video_id:
              print(
                  "ERROR: Facebook video ID was not returned."
              )
              print(data)
              raise SystemExit(1)

          print(
              "Facebook Video ID:",
              video_id
          )

          with open(
              "facebook_video_id.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(video_id)

          print("Facebook upload successful.")
          PY


      # ============================================================
      # 9. FIND OR CREATE POSTED FOLDER
      # ============================================================
      - name: Find or create Posted folder
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          echo "Checking Posted folder..."

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Posted" \
            -o posted_folder.json \
            -w "%{http_code}" \
            > posted_http_code.txt

          HTTP_CODE=$(cat posted_http_code.txt)

          echo "Posted folder HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" = "200" ]; then

            python - <<'PY'
          import json

          with open(
              "posted_folder.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          folder_id = data.get("id")

          if not folder_id:
              print("ERROR: Posted folder ID not found.")
              print(data)
              raise SystemExit(1)

          print("Posted folder found.")
          print("Folder ID:", folder_id)

          with open(
              "posted_folder_id.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(folder_id)
          PY

          elif [ "${HTTP_CODE}" = "404" ]; then

            echo "Posted folder does not exist."
            echo "Creating Posted folder..."

            printf '%s' \
              '{"name":"Posted","folder":{},"@microsoft.graph.conflictBehavior":"fail"}' \
              > create_posted.json

            curl -sS \
              -X POST \
              "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root/children" \
              -H "Authorization: Bearer ${GRAPH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @create_posted.json \
              -o posted_folder_created.json \
              -w "%{http_code}" \
              > posted_create_http_code.txt

            CREATE_HTTP_CODE=$(cat posted_create_http_code.txt)

            echo "Create folder HTTP Status: ${CREATE_HTTP_CODE}"

            if [ "${CREATE_HTTP_CODE}" -lt 200 ] || [ "${CREATE_HTTP_CODE}" -ge 300 ]; then
              echo "ERROR: Could not create Posted folder."
              cat posted_folder_created.json
              exit 1
            fi

            python - <<'PY'
          import json

          with open(
              "posted_folder_created.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          folder_id = data.get("id")

          if not folder_id:
              print(
                  "ERROR: Created Posted folder ID not found."
              )
              print(data)
              raise SystemExit(1)

          print("Posted folder created.")
          print("Folder ID:", folder_id)

          with open(
              "posted_folder_id.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(folder_id)
          PY

          else

            echo "ERROR: Unexpected Posted folder response."
            cat posted_folder.json
            exit 1

          fi

          POSTED_FOLDER_ID=$(cat posted_folder_id.txt)

          echo "POSTED_FOLDER_ID=${POSTED_FOLDER_ID}" >> "$GITHUB_ENV"

          echo "Posted folder ready."


      # ============================================================
      # 10. MOVE SUCCESSFULLY POSTED VIDEO TO POSTED
      # ============================================================
      - name: Move successfully posted video to Posted
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
          POSTED_FOLDER_ID: ${{ env.POSTED_FOLDER_ID }}
        run: |
          set -e

          ITEM_ID=$(cat selected_item_id.txt)
          VIDEO=$(cat selected_video.txt)

          echo "Moving successfully posted video:"
          echo "${VIDEO}"

          printf '%s' \
            "{\"parentReference\":{\"id\":\"${POSTED_FOLDER_ID}\"}}" \
            > move_body.json

          curl -sS \
            -X PATCH \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/${ITEM_ID}" \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @move_body.json \
            -o move_response.json \
            -w "%{http_code}" \
            > move_http_code.txt

          MOVE_HTTP_CODE=$(cat move_http_code.txt)

          echo "Move HTTP Status: ${MOVE_HTTP_CODE}"

          if [ "${MOVE_HTTP_CODE}" != "200" ]; then
            echo "ERROR: Facebook post succeeded but OneDrive move failed."
            cat move_response.json
            exit 1
          fi

          echo "Video successfully moved to Posted."


      # ============================================================
      # 11. FINAL RESULT
      # ============================================================
      - name: Final result
        run: |
          echo ""
          echo "========================================"
          echo "FACEBOOK AUTO POST SUCCESS"
          echo "========================================"

          echo "Video:"
          cat selected_video.txt

          echo ""
          echo "Part:"
          cat current_part.txt

          echo ""
          echo "Total Parts:"
          cat total_parts.txt

          echo ""
          echo "Facebook Video ID:"
          cat facebook_video_id.txt

          echo ""
          echo "Caption and hashtags:"
          cat post_caption.txt

          echo ""
          echo "OneDrive:"
          echo "Pending_Posts -> Posted"

          echo ""
          echo "Next scheduled run will process the next part."

          echo "========================================"
