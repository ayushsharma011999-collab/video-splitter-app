name: Facebook Auto Poster - Test

on:
workflow_dispatch:

jobs:
publish-one-video:
runs-on: ubuntu-latest

steps:
  - name: Get Microsoft Graph token
    env:
      TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    run: |
      set -e

      echo "Getting Microsoft Graph token..."

      curl -sS \
        -X POST \
        "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        --data-urlencode "client_id=${CLIENT_ID}" \
        --data-urlencode "client_secret=${CLIENT_SECRET}" \
        --data-urlencode "scope=https://graph.microsoft.com/.default" \
        --data-urlencode "grant_type=client_credentials" \
        -o token_response.json

      python - <<'PY'
      import json
      import sys

      with open("token_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      token = data.get("access_token", "")

      if not token:
          print("ERROR: Graph token was not received.")
          print(data)
          sys.exit(1)

      with open("graph_token.txt", "w", encoding="utf-8") as f:
          f.write(token)

      print("Graph token obtained successfully.")
      PY

      echo "GRAPH_TOKEN=$(cat graph_token.txt)" >> "$GITHUB_ENV"


  - name: Prepare folders
    run: |
      set -e

      mkdir -p pending_files

      echo "Working folder created."


  - name: List Pending_Posts
    env:
      GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
    run: |
      set -e

      echo "Reading Pending_Posts..."

      HTTP_CODE=$(curl -sS \
        -o pending_list.json \
        -w "%{http_code}" \
        -H "Authorization: Bearer ${GRAPH_TOKEN}" \
        "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Pending_Posts:/children")

      echo "HTTP status: ${HTTP_CODE}"

      if [ "${HTTP_CODE}" != "200" ]; then
        echo "ERROR: Could not read Pending_Posts."
        cat pending_list.json
        exit 1
      fi

      python - <<'PY'
      import json
      import sys

      with open("pending_list.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      items = data.get("value", [])

      print("Files found:", len(items))

      if not items:
          print("No files found in Pending_Posts.")
          sys.exit(1)

      for item in items:
          print("-", item.get("name", "UNKNOWN"))
      PY


  - name: Download metadata
    run: |
      set -e

      python - <<'PY'
      import json
      import subprocess
      import sys

      with open("pending_list.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      items = data.get("value", [])

      metadata = None

      for item in items:
          name = item.get("name", "")

          if name.lower().endswith("_metadata.json"):
              metadata = item
              break

      if metadata is None:
          print("ERROR: Metadata JSON not found.")
          sys.exit(1)

      name = metadata["name"]
      url = metadata.get("@microsoft.graph.downloadUrl")

      if not url:
          print("ERROR: Metadata download URL not found.")
          sys.exit(1)

      print("Downloading:", name)

      subprocess.run(
          [
              "curl",
              "-L",
              "-sS",
              url,
              "-o",
              f"pending_files/{name}"
          ],
          check=True
      )

      print("Metadata downloaded.")
      PY


  - name: Read metadata
    run: |
      set -e

      python - <<'PY'
      import glob
      import json
      import sys

      files = glob.glob("pending_files/*_metadata.json")

      if not files:
          print("ERROR: Metadata file missing.")
          sys.exit(1)

      metadata_file = files[0]

      with open(metadata_file, "r", encoding="utf-8") as f:
          data = json.load(f)

      caption = str(data.get("caption", ""))
      post_type = str(data.get("post_type", "Video"))

      with open("post_caption.txt", "w", encoding="utf-8") as f:
          f.write(caption)

      with open("post_type.txt", "w", encoding="utf-8") as f:
          f.write(post_type)

      print("Post type:", post_type)
      print("Caption available:", bool(caption))
      PY


  - name: Select first video
    run: |
      set -e

      python - <<'PY'
      import json
      import sys

      with open("pending_list.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      items = data.get("value", [])

      videos = [
          item
          for item in items
          if item.get("name", "").lower().endswith(".mp4")
      ]

      videos.sort(key=lambda x: x.get("name", ""))

      if not videos:
          print("ERROR: No MP4 video found.")
          sys.exit(1)

      video = videos[0]

      name = video.get("name", "")
      item_id = video.get("id", "")
      url = video.get("@microsoft.graph.downloadUrl", "")

      if not name or not item_id or not url:
          print("ERROR: Video information is incomplete.")
          sys.exit(1)

      with open("selected_video.txt", "w", encoding="utf-8") as f:
          f.write(name)

      with open("selected_item_id.txt", "w", encoding="utf-8") as f:
          f.write(item_id)

      with open("selected_download_url.txt", "w", encoding="utf-8") as f:
          f.write(url)

      print("Selected video:", name)
      PY


  - name: Download video
    run: |
      set -e

      VIDEO=$(cat selected_video.txt)
      URL=$(cat selected_download_url.txt)

      echo "Downloading video:"
      echo "${VIDEO}"

      curl -L \
        -sS \
        --fail \
        "${URL}" \
        -o "pending_files/${VIDEO}"

      if [ ! -s "pending_files/${VIDEO}" ]; then
        echo "ERROR: Video download failed."
        exit 1
      fi

      ls -lh "pending_files/${VIDEO}"

      echo "Video downloaded successfully."


  - name: Check Facebook secrets
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    run: |
      set -e

      if [ -z "${FACEBOOK_PAGE_ID}" ]; then
        echo "ERROR: FACEBOOK_PAGE_ID is empty."
        exit 1
      fi

      if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN}" ]; then
        echo "ERROR: FACEBOOK_PAGE_ACCESS_TOKEN is empty."
        exit 1
      fi

      echo "Facebook Page ID: available"
      echo "Facebook Access Token: available"


  - name: Publish video to Facebook
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    run: |
      set -e

      VIDEO=$(cat selected_video.txt)
      CAPTION=$(cat post_caption.txt)

      echo "Publishing:"
      echo "${VIDEO}"

      curl -sS \
        -X POST \
        "https://graph.facebook.com/v23.0/${FACEBOOK_PAGE_ID}/videos" \
        -H "Authorization: Bearer ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
        -F "source=@pending_files/${VIDEO}" \
        --form-string "description=${CAPTION}" \
        -o facebook_response.json \
        -w "%{http_code}" \
        > facebook_http_code.txt

      HTTP_CODE=$(cat facebook_http_code.txt)

      echo "Facebook HTTP status: ${HTTP_CODE}"

      echo "Facebook response:"
      cat facebook_response.json

      if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
        echo "ERROR: Facebook API request failed."
        exit 1
      fi

      python - <<'PY'
      import json
      import sys

      with open("facebook_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      if "error" in data:
          print("Facebook API error:")
          print(data)
          sys.exit(1)

      video_id = data.get("id", "")

      if not video_id:
          print("ERROR: Facebook video ID not found.")
          print(data)
          sys.exit(1)

      with open("facebook_video_id.txt", "w", encoding="utf-8") as f:
          f.write(video_id)

      print("Facebook publish successful.")
      print("Video ID:", video_id)
      PY


  - name: Find or create Posted folder
    env:
      GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
    run: |
      set -e

      echo "Checking Posted folder..."

      HTTP_CODE=$(curl -sS \
        -o posted_response.json \
        -w "%{http_code}" \
        -H "Authorization: Bearer ${GRAPH_TOKEN}" \
        "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Posted")

      echo "Posted folder HTTP status: ${HTTP_CODE}"

      if [ "${HTTP_CODE}" = "200" ]; then

        python - <<'PY'
      import json
      import sys

      with open("posted_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      folder_id = data.get("id", "")

      if not folder_id:
          print("ERROR: Posted folder ID not found.")
          sys.exit(1)

      with open("posted_folder_id.txt", "w", encoding="utf-8") as f:
          f.write(folder_id)

      print("Posted folder found.")
      PY

      elif [ "${HTTP_CODE}" = "404" ]; then

        echo "Posted folder does not exist."
        echo "Creating Posted folder..."

        CREATE_CODE=$(curl -sS \
          -o create_posted_response.json \
          -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GRAPH_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"name":"Posted","folder":{},"@microsoft.graph.conflictBehavior":"fail"}' \
          "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root/children")

        echo "Create HTTP status: ${CREATE_CODE}"

        if [ "${CREATE_CODE}" != "201" ]; then
          echo "ERROR: Posted folder creation failed."
          cat create_posted_response.json
          exit 1
        fi

        python - <<'PY'
      import json
      import sys

      with open("create_posted_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      folder_id = data.get("id", "")

      if not folder_id:
          print("ERROR: Created folder ID not found.")
          sys.exit(1)

      with open("posted_folder_id.txt", "w", encoding="utf-8") as f:
          f.write(folder_id)

      print("Posted folder created.")
      PY

      else

        echo "ERROR: Unexpected Graph response."
        cat posted_response.json
        exit 1

      fi

      POSTED_FOLDER_ID=$(cat posted_folder_id.txt)

      if [ -z "${POSTED_FOLDER_ID}" ]; then
        echo "ERROR: Posted folder ID is empty."
        exit 1
      fi

      echo "POSTED_FOLDER_ID=${POSTED_FOLDER_ID}" >> "$GITHUB_ENV"

      echo "Posted folder ready."


  - name: Move video to Posted
    env:
      GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
      POSTED_FOLDER_ID: ${{ env.POSTED_FOLDER_ID }}
    run: |
      set -e

      ITEM_ID=$(cat selected_item_id.txt)
      VIDEO=$(cat selected_video.txt)

      echo "Moving video:"
      echo "${VIDEO}"

      printf '{"parentReference":{"id":"%s"}}' "${POSTED_FOLDER_ID}" > move_body.json

      MOVE_CODE=$(curl -sS \
        -o move_response.json \
        -w "%{http_code}" \
        -X PATCH \
        "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/${ITEM_ID}" \
        -H "Authorization: Bearer ${GRAPH_TOKEN}" \
        -H "Content-Type: application/json" \
        --data-binary @move_body.json)

      echo "Move HTTP status: ${MOVE_CODE}"

      if [ "${MOVE_CODE}" != "200" ]; then
        echo "ERROR: OneDrive move failed."
        cat move_response.json
        exit 1
      fi

      echo "Video moved to Posted successfully."


  - name: Final result
    run: |
      echo ""
      echo "=========================================="
      echo "       FACEBOOK AUTO POST TEST"
      echo "=========================================="
      echo ""
      echo "Video:"
      cat selected_video.txt
      echo ""
      echo "Facebook Video ID:"
      cat facebook_video_id.txt
      echo ""
      echo "OneDrive:"
      echo "Pending_Posts -> Posted"
      echo ""
      echo "STATUS: SUCCESS"
      echo "=========================================="
```
