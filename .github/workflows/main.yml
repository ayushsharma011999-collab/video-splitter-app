name: OneDrive Upload Test

on:
  workflow_dispatch:

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Microsoft Graph token
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(python -c "import json; print(json.loads('''$RESPONSE''').get('access_token',''))")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not get Graph token."
            exit 1
          fi

          echo "GRAPH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Graph token obtained."

      - name: Upload test file to Pending_Posts
        run: |
          echo "OneDrive Auto Poster connection test successful." > connection-test.txt

          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @connection-test.txt \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Pending_Posts/connection-test.txt:/content")

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "SUCCESS: Test file uploaded to Pending_Posts."
          else
            echo "ERROR: Upload failed."
            exit 1
          fi
