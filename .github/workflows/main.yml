name: Facebook Auto Poster - Test

on:
  workflow_dispatch:

jobs:
  publish-one-video:
    runs-on: ubuntu-latest

    steps:

      - name: Get Microsoft Graph token
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -e

          echo "Getting Microsoft Graph token..."

          curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials" \
            -o graph_token_response.json

          python - <<'PY'
          import json

          with open("graph_token_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          token = data.get("access_token")

          if not token:
              print("ERROR: Microsoft Graph token was not returned.")
              print(data)
              raise SystemExit(1)

          with open("graph_token.txt", "w", encoding="utf-8") as f:
              f.write(token)

          print("Graph token obtained successfully.")
          PY

          echo "GRAPH_TOKEN=$(cat graph_token.txt)" >> "$GITHUB_ENV"


      - name: Prepare folders
        run: |
          set -e

          mkdir -p pending_files

          echo "Working directory prepared."


      - name: List Pending_Posts
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          echo "Listing Pending_Posts..."

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Pending_Posts:/children" \
            -o pending_list.json \
            -w "%{http_code}" \
            > pending_http_code.txt

          HTTP_CODE=$(cat pending_http_code.txt)

          echo "HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "ERROR: Could not list Pending_Posts."
            cat pending_list.json
            exit 1
          fi

          python - <<'PY'
          import json

          with open("pending_list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          print("Files found in Pending_Posts:", len(items))

          for item in items:
              print(
                  item.get("name"),
                  "|",
                  item.get("id")
              )
          PY


      - name: Find metadata file
        run: |
          set -e

          python - <<'PY'
          import json

          with open("pending_list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          metadata = None

          for item in items:
              name = item.get("name", "")

              if name.lower().endswith("_metadata.json"):
                  metadata = item
                  break

          if metadata is None:
              print("ERROR: No metadata JSON found.")
              raise SystemExit(1)

          print("Metadata file:")
          print(metadata["name"])
          print("Item ID:")
          print(metadata["id"])

          with open("metadata_item_id.txt", "w", encoding="utf-8") as f:
              f.write(metadata["id"])

          with open("metadata_download_url.txt", "w", encoding="utf-8") as f:
              f.write(metadata["@microsoft.graph.downloadUrl"])
          PY


      - name: Download metadata
        run: |
          set -e

          METADATA_URL=$(cat metadata_download_url.txt)

          echo "Downloading metadata..."

          curl -L --fail \
            "${METADATA_URL}" \
            -o metadata.json

          echo "Metadata downloaded."

          cat metadata.json


      - name: Read metadata
        run: |
          set -e

          python - <<'PY'
          import json

          with open("metadata.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Metadata:")
          print(json.dumps(data, indent=2, ensure_ascii=False))

          caption = data.get("caption", "")

          if not caption:
              caption = data.get("description", "")

          if not caption:
              caption = "New video"

          post_type = data.get("post_type", "video")

          with open("post_caption.txt", "w", encoding="utf-8") as f:
              f.write(caption)

          with open("post_type.txt", "w", encoding="utf-8") as f:
              f.write(post_type)

          print("Caption loaded successfully.")
          print("Post type:", post_type)
          PY


      - name: Select first video
        run: |
          set -e

          python - <<'PY'
          import json

          with open("pending_list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          videos = []

          for item in items:
              name = item.get("name", "")

              if name.lower().endswith(".mp4"):
                  videos.append(item)

          if not videos:
              print("ERROR: No MP4 video found in Pending_Posts.")
              raise SystemExit(1)

          videos.sort(key=lambda x: x.get("name", ""))

          video = videos[0]

          name = video["name"]
          item_id = video["id"]
          download_url = video.get("@microsoft.graph.downloadUrl")

          if not download_url:
              print("ERROR: Download URL not available.")
              raise SystemExit(1)

          print("Selected video:")
          print(name)

          print("Item ID:")
          print(item_id)

          with open("selected_video.txt", "w", encoding="utf-8") as f:
              f.write(name)

          with open("selected_item_id.txt", "w", encoding="utf-8") as f:
              f.write(item_id)

          with open("selected_download_url.txt", "w", encoding="utf-8") as f:
              f.write(download_url)
          PY


      - name: Download video
        run: |
          set -e

          VIDEO=$(cat selected_video.txt)
          VIDEO_URL=$(cat selected_download_url.txt)

          echo "Downloading:"
          echo "${VIDEO}"

          curl -L --fail \
            "${VIDEO_URL}" \
            -o "pending_files/${VIDEO}"

          echo "Video downloaded successfully."

          ls -lh pending_files/


      - name: Check Facebook secrets
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          if [ -z "${FACEBOOK_PAGE_ID}" ]; then
            echo "ERROR: FACEBOOK_PAGE_ID secret is missing."
            exit 1
          fi

          if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN}" ]; then
            echo "ERROR: FACEBOOK_PAGE_ACCESS_TOKEN secret is missing."
            exit 1
          fi

          echo "Facebook secrets are available."


      - name: Publish video to Facebook
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          VIDEO=$(cat selected_video.txt)
          CAPTION=$(cat post_caption.txt)

          echo "Publishing video to Facebook..."
          echo "Video: ${VIDEO}"

          curl -sS \
            -X POST \
            "https://graph.facebook.com/v23.0/${FACEBOOK_PAGE_ID}/videos" \
            -H "Authorization: Bearer ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            -F "source=@pending_files/${VIDEO}" \
            --form-string "description=${CAPTION}" \
            -o facebook_response.json \
            -w "%{http_code}" \
            > facebook_http_code.txt

          FACEBOOK_HTTP_CODE=$(cat facebook_http_code.txt)

          echo "Facebook HTTP Status: ${FACEBOOK_HTTP_CODE}"

          echo "Facebook response:"
          cat facebook_response.json

          if [ "${FACEBOOK_HTTP_CODE}" -lt 200 ] || [ "${FACEBOOK_HTTP_CODE}" -ge 300 ]; then
            echo "ERROR: Facebook upload failed."
            exit 1
          fi

          python - <<'PY'
          import json

          with open("facebook_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          video_id = data.get("id")

          if not video_id:
              print("ERROR: Facebook video ID was not returned.")
              print(data)
              raise SystemExit(1)

          print("Facebook video ID:", video_id)

          with open("facebook_video_id.txt", "w", encoding="utf-8") as f:
              f.write(video_id)

          print("Facebook upload successful.")
          PY


      - name: Find or create Posted folder
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          echo "Checking Posted folder..."

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Posted" \
            -o posted_folder.json \
            -w "%{http_code}" \
            > posted_http_code.txt

          HTTP_CODE=$(cat posted_http_code.txt)

          echo "Posted folder HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" = "200" ]; then

            python - <<'PY'
          import json

          with open("posted_folder.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          folder_id = data.get("id")

          if not folder_id:
              print("ERROR: Posted folder ID not found.")
              print(data)
              raise SystemExit(1)

          print("Posted folder already exists.")
          print("Folder ID:", folder_id)

          with open("posted_folder_id.txt", "w", encoding="utf-8") as f:
              f.write(folder_id)
          PY

          elif [ "${HTTP_CODE}" = "404" ]; then

            echo "Posted folder does not exist. Creating it..."

            printf '%s' \
              '{"name":"Posted","folder":{},"@microsoft.graph.conflictBehavior":"fail"}' \
              > create_posted.json

            curl -sS \
              -X POST \
              "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root/children" \
              -H "Authorization: Bearer ${GRAPH_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @create_posted.json \
              -o posted_folder_created.json \
              -w "%{http_code}" \
              > posted_create_http_code.txt

            CREATE_HTTP_CODE=$(cat posted_create_http_code.txt)

            echo "Create Posted HTTP Status: ${CREATE_HTTP_CODE}"

            cat posted_folder_created.json

            if [ "${CREATE_HTTP_CODE}" -lt 200 ] || [ "${CREATE_HTTP_CODE}" -ge 300 ]; then
              echo "ERROR: Could not create Posted folder."
              exit 1
            fi

            python - <<'PY'
          import json

          with open("posted_folder_created.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          folder_id = data.get("id")

          if not folder_id:
              print("ERROR: Created Posted folder ID not found.")
              print(data)
              raise SystemExit(1)

          print("Posted folder created.")
          print("Folder ID:", folder_id)

          with open("posted_folder_id.txt", "w", encoding="utf-8") as f:
              f.write(folder_id)
          PY

          else
            echo "ERROR: Unexpected response while finding Posted folder."
            cat posted_folder.json
            exit 1
          fi

          POSTED_FOLDER_ID=$(cat posted_folder_id.txt)

          echo "POSTED_FOLDER_ID=${POSTED_FOLDER_ID}" >> "$GITHUB_ENV"

          echo "Posted folder ready."


      - name: Move video to Posted
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
          POSTED_FOLDER_ID: ${{ env.POSTED_FOLDER_ID }}
        run: |
          set -e

          ITEM_ID=$(cat selected_item_id.txt)
          VIDEO=$(cat selected_video.txt)

          echo "Moving video:"
          echo "${VIDEO}"

          echo "Destination folder:"
          echo "${POSTED_FOLDER_ID}"

          printf '%s' \
            "{\"parentReference\":{\"id\":\"${POSTED_FOLDER_ID}\"}}" \
            > move_body.json

          curl -sS \
            -X PATCH \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/${ITEM_ID}" \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @move_body.json \
            -o move_response.json \
            -w "%{http_code}" \
            > move_http_code.txt

          MOVE_HTTP_CODE=$(cat move_http_code.txt)

          echo "Move HTTP Status: ${MOVE_HTTP_CODE}"

          if [ "${MOVE_HTTP_CODE}" != "200" ]; then
            echo "ERROR: Video could not be moved to Posted."
            cat move_response.json
            exit 1
          fi

          echo "Video successfully moved to Posted."


      - name: Final result
        run: |
          echo "========================================"
          echo "FACEBOOK AUTO POST TEST COMPLETED"
          echo "========================================"

          echo "Video:"
          cat selected_video.txt

          echo ""
          echo "Facebook Video ID:"
          cat facebook_video_id.txt

          echo ""
          echo "Status:"
          echo "Published to Facebook"

          echo ""
          echo "OneDrive:"
          echo "Moved from Pending_Posts to Posted"

          echo "========================================"
