name: OneDrive Drive Test

on:
  workflow_dispatch:

jobs:
  test-drive:
    runs-on: ubuntu-latest

    steps:
      - name: Get Microsoft Graph token
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          TOKEN=$(python -c "import json; print(json.loads('''$RESPONSE''').get('access_token',''))")

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not get Graph token."
            echo "$RESPONSE"
            exit 1
          fi

          echo "GRAPH_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Graph token obtained."

      - name: Test OneDrive
        run: |
          curl -s \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive" \
            -o drive.json

          cat drive.json

          if grep -q '"id"' drive.json; then
            echo "SUCCESS: OneDrive drive found."
          else
            echo "ERROR: Could not access this user's OneDrive."
            exit 1
          fi
