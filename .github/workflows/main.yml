name: Facebook Auto Poster - Test

on:
workflow_dispatch:

jobs:
publish-one-video:
runs-on: ubuntu-latest

```
env:
  ONEDRIVE_USER: my@011999.onmicrosoft.com
  GRAPH_BASE: https://graph.microsoft.com/v1.0

steps:

  # ==================================================
  # 1. GET MICROSOFT GRAPH TOKEN
  # ==================================================
  - name: Get Microsoft Graph token
    env:
      TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    shell: bash
    run: |
      set -euo pipefail

      echo "Getting Microsoft Graph token..."

      curl -sS \
        --fail-with-body \
        -X POST \
        "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
        -H "Content-Type: application/x-www-form-urlencoded" \
        --data-urlencode "client_id=${CLIENT_ID}" \
        --data-urlencode "client_secret=${CLIENT_SECRET}" \
        --data-urlencode "scope=https://graph.microsoft.com/.default" \
        --data-urlencode "grant_type=client_credentials" \
        -o token_response.json

      python - <<'PY'
      import json
      import sys

      with open("token_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      token = data.get("access_token")

      if not token:
          print("ERROR: Microsoft Graph token missing.")
          print(json.dumps(data, indent=2))
          sys.exit(1)

      with open("graph_token.txt", "w", encoding="utf-8") as f:
          f.write(token)

      print("Graph token obtained successfully.")
      PY

      echo "GRAPH_TOKEN=$(cat graph_token.txt)" >> "$GITHUB_ENV"


  # ==================================================
  # 2. PREPARE FOLDERS
  # ==================================================
  - name: Prepare folders
    shell: bash
    run: |
      set -euo pipefail

      mkdir -p pending_files

      echo "Working folder ready."


  # ==================================================
  # 3. LIST PENDING_POSTS
  # ==================================================
  - name: List Pending_Posts
    shell: bash
    run: |
      set -euo pipefail

      echo "Reading Pending_Posts..."

      HTTP_CODE=$(curl -sS \
        -o pending_list.json \
        -w "%{http_code}" \
        -H "Authorization: Bearer ${GRAPH_TOKEN}" \
        "${GRAPH_BASE}/users/${ONEDRIVE_USER}/drive/root:/Pending_Posts:/children")

      echo "Graph HTTP status: ${HTTP_CODE}"

      if [ "${HTTP_CODE}" != "200" ]; then
        echo "ERROR: Pending_Posts could not be read."
        cat pending_list.json
        exit 1
      fi

      python - <<'PY'
      import json
      import sys

      with open("pending_list.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      items = data.get("value", [])

      print(f"Pending_Posts contains {len(items)} item(s).")

      if not items:
          print("No pending files found.")
          sys.exit(1)

      for item in items:
          print("-", item.get("name", "UNKNOWN"))
      PY


  # ==================================================
  # 4. FIND AND DOWNLOAD METADATA
  # ==================================================
  - name: Download metadata
    shell: bash
    run: |
      set -euo pipefail

      python - <<'PY'
      import json
      import subprocess
      import sys

      with open("pending_list.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      items = data.get("value", [])

      metadata = None

      for item in items:
          name = item.get("name", "")

          if name.lower().endswith("_metadata.json"):
              metadata = item
              break

      if metadata is None:
          print("ERROR: No metadata JSON found.")
          sys.exit(1)

      name = metadata["name"]
      url = metadata.get("@microsoft.graph.downloadUrl")

      if not url:
          print("ERROR: Metadata download URL missing.")
          sys.exit(1)

      print("Metadata:", name)

      subprocess.run(
          [
              "curl",
              "-L",
              "-sS",
              url,
              "-o",
              f"pending_files/{name}"
          ],
          check=True
      )

      print("Metadata downloaded.")
      PY


  # ==================================================
  # 5. READ METADATA
  # ==================================================
  - name: Read metadata
    shell: bash
    run: |
      set -euo pipefail

      python - <<'PY'
      import glob
      import json
      import sys

      files = glob.glob("pending_files/*_metadata.json")

      if not files:
          print("ERROR: Metadata file not found.")
          sys.exit(1)

      metadata_file = files[0]

      with open(metadata_file, "r", encoding="utf-8") as f:
          data = json.load(f)

      print("Metadata loaded successfully.")

      caption = str(data.get("caption", ""))
      post_type = str(data.get("post_type", "Video"))

      page_id = str(data.get("facebook_page_id", ""))

      with open("post_caption.txt", "w", encoding="utf-8") as f:
          f.write(caption)

      with open("post_type.txt", "w", encoding="utf-8") as f:
          f.write(post_type)

      with open("metadata_page_id.txt", "w", encoding="utf-8") as f:
          f.write(page_id)

      print("Post type:", post_type)
      print("Caption available:", bool(caption))
      print("Metadata Page ID available:", bool(page_id))
      PY


  # ==================================================
  # 6. FIND FIRST MP4
  # ==================================================
  - name: Select first pending video
    shell: bash
    run: |
      set -euo pipefail

      python - <<'PY'
      import json
      import sys

      with open("pending_list.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      items = data.get("value", [])

      videos = []

      for item in items:
          name = item.get("name", "")

          if name.lower().endswith(".mp4"):
              videos.append(item)

      videos.sort(key=lambda x: x.get("name", ""))

      if not videos:
          print("ERROR: No MP4 video found.")
          sys.exit(1)

      video = videos[0]

      name = video.get("name", "")
      item_id = video.get("id", "")
      url = video.get("@microsoft.graph.downloadUrl", "")

      if not name:
          print("ERROR: Video name missing.")
          sys.exit(1)

      if not item_id:
          print("ERROR: Video item ID missing.")
          sys.exit(1)

      if not url:
          print("ERROR: Video download URL missing.")
          sys.exit(1)

      with open("selected_video.txt", "w", encoding="utf-8") as f:
          f.write(name)

      with open("selected_item_id.txt", "w", encoding="utf-8") as f:
          f.write(item_id)

      with open("selected_download_url.txt", "w", encoding="utf-8") as f:
          f.write(url)

      print("Selected video:", name)
      print("Item ID found: YES")
      PY


  # ==================================================
  # 7. DOWNLOAD VIDEO
  # ==================================================
  - name: Download selected video
    shell: bash
    run: |
      set -euo pipefail

      VIDEO=$(cat selected_video.txt)
      URL=$(cat selected_download_url.txt)

      echo "Downloading:"
      echo "${VIDEO}"

      curl -L \
        -sS \
        --fail \
        "${URL}" \
        -o "pending_files/${VIDEO}"

      if [ ! -s "pending_files/${VIDEO}" ]; then
        echo "ERROR: Downloaded video is empty."
        exit 1
      fi

      echo "Video downloaded successfully."

      ls -lh "pending_files/${VIDEO}"


  # ==================================================
  # 8. CHECK FACEBOOK SECRETS
  # ==================================================
  - name: Check Facebook configuration
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    shell: bash
    run: |
      set -euo pipefail

      if [ -z "${FACEBOOK_PAGE_ID}" ]; then
        echo "ERROR: FACEBOOK_PAGE_ID secret is empty."
        exit 1
      fi

      if [ -z "${FACEBOOK_PAGE_ACCESS_TOKEN}" ]; then
        echo "ERROR: FACEBOOK_PAGE_ACCESS_TOKEN secret is empty."
        exit 1
      fi

      echo "Facebook Page ID: available"
      echo "Facebook Access Token: available"


  # ==================================================
  # 9. PUBLISH ONE VIDEO TO FACEBOOK
  # ==================================================
  - name: Publish video to Facebook
    env:
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
    shell: bash
    run: |
      set -euo pipefail

      VIDEO=$(cat selected_video.txt)
      CAPTION=$(cat post_caption.txt)

      echo "Publishing:"
      echo "${VIDEO}"

      curl -sS \
        -X POST \
        "https://graph.facebook.com/v23.0/${FACEBOOK_PAGE_ID}/videos" \
        -H "Authorization: Bearer ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
        -F "source=@pending_files/${VIDEO}" \
        --form-string "description=${CAPTION}" \
        -o facebook_response.json \
        -w "%{http_code}" \
        > facebook_http_code.txt

      HTTP_CODE=$(cat facebook_http_code.txt)

      echo "Facebook HTTP status: ${HTTP_CODE}"

      if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
        echo "ERROR: Facebook API request failed."
        cat facebook_response.json
        exit 1
      fi

      python - <<'PY'
      import json
      import sys

      with open("facebook_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      if "error" in data:
          print("ERROR: Facebook returned an API error.")
          print(json.dumps(data, indent=2))
          sys.exit(1)

      video_id = data.get("id", "")

      if not video_id:
          print("ERROR: Facebook video ID not found.")
          print(json.dumps(data, indent=2))
          sys.exit(1)

      with open("facebook_video_id.txt", "w", encoding="utf-8") as f:
          f.write(video_id)

      print("Facebook publish successful.")
      print("Facebook Video ID:", video_id)
      PY


  # ==================================================
  # 10. FIND OR CREATE POSTED FOLDER
  # ==================================================
  - name: Find or create Posted folder
    shell: bash
    run: |
      set -euo pipefail

      echo "Checking Posted folder..."

      HTTP_CODE=$(curl -sS \
        -o posted_response.json \
        -w "%{http_code}" \
        -H "Authorization: Bearer ${GRAPH_TOKEN}" \
        "${GRAPH_BASE}/users/${ONEDRIVE_USER}/drive/root:/Posted")

      echo "Posted folder HTTP status: ${HTTP_CODE}"

      if [ "${HTTP_CODE}" = "200" ]; then

        python - <<'PY'
      import json
      import sys

      with open("posted_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      folder_id = data.get("id", "")

      if not folder_id:
          print("ERROR: Posted folder ID missing.")
          sys.exit(1)

      with open("posted_folder_id.txt", "w", encoding="utf-8") as f:
          f.write(folder_id)

      print("Posted folder already exists.")
      PY

      elif [ "${HTTP_CODE}" = "404" ]; then

        echo "Posted folder does not exist."
        echo "Creating Posted folder..."

        CREATE_CODE=$(curl -sS \
          -o create_posted_response.json \
          -w "%{http_code}" \
          -X POST \
          -H "Authorization: Bearer ${GRAPH_TOKEN}" \
          -H "Content-Type: application/json" \
          -d '{"name":"Posted","folder":{},"@microsoft.graph.conflictBehavior":"fail"}' \
          "${GRAPH_BASE}/users/${ONEDRIVE_USER}/drive/root/children")

        echo "Create folder HTTP status: ${CREATE_CODE}"

        if [ "${CREATE_CODE}" != "201" ]; then
          echo "ERROR: Posted folder creation failed."
          cat create_posted_response.json
          exit 1
        fi

        python - <<'PY'
      import json
      import sys

      with open("create_posted_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      folder_id = data.get("id", "")

      if not folder_id:
          print("ERROR: New Posted folder ID missing.")
          sys.exit(1)

      with open("posted_folder_id.txt", "w", encoding="utf-8") as f:
          f.write(folder_id)

      print("Posted folder created.")
      PY

      else

        echo "ERROR: Unexpected response while finding Posted folder."
        cat posted_response.json
        exit 1

      fi

      POSTED_FOLDER_ID=$(cat posted_folder_id.txt)

      if [ -z "${POSTED_FOLDER_ID}" ]; then
        echo "ERROR: Posted folder ID is empty."
        exit 1
      fi

      echo "POSTED_FOLDER_ID=${POSTED_FOLDER_ID}" >> "$GITHUB_ENV"

      echo "Posted folder ready."


  # ==================================================
  # 11. MOVE VIDEO FROM PENDING TO POSTED
  # ==================================================
  - name: Move video to Posted
    shell: bash
    run: |
      set -euo pipefail

      ITEM_ID=$(cat selected_item_id.txt)
      VIDEO=$(cat selected_video.txt)

      echo "Moving video:"
      echo "${VIDEO}"

      python - <<'PY'
      import json
      import os

      item_id = open("selected_item_id.txt", encoding="utf-8").read().strip()
      folder_id = os.environ["POSTED_FOLDER_ID"]

      body = {
          "parentReference": {
              "id": folder_id
          }
      }

      with open("move_body.json", "w", encoding="utf-8") as f:
          json.dump(body, f)

      print("Move request prepared.")
      PY

      MOVE_CODE=$(curl -sS \
        -o move_response.json \
        -w "%{http_code}" \
        -X PATCH \
        "${GRAPH_BASE}/users/${ONEDRIVE_USER}/drive/items/${ITEM_ID}" \
        -H "Authorization: Bearer ${GRAPH_TOKEN}" \
        -H "Content-Type: application/json" \
        --data-binary @move_body.json)

      echo "Move HTTP status: ${MOVE_CODE}"

      if [ "${MOVE_CODE}" != "200" ]; then
        echo "ERROR: OneDrive move failed."
        cat move_response.json
        exit 1
      fi

      python - <<'PY'
      import json
      import sys

      with open("move_response.json", "r", encoding="utf-8") as f:
          data = json.load(f)

      moved_id = data.get("id", "")

      if not moved_id:
          print("ERROR: Move response does not contain item ID.")
          sys.exit(1)

      print("Video moved successfully.")
      print("Moved item ID:", moved_id)
      PY


  # ==================================================
  # 12. FINAL RESULT
  # ==================================================
  - name: Final result
    shell: bash
    run: |
      echo ""
      echo "=============================================="
      echo "       FACEBOOK AUTO POST TEST SUCCESS"
      echo "=============================================="
      echo ""

      echo "Video:"
      cat selected_video.txt

      echo ""

      echo "Facebook Video ID:"
      cat facebook_video_id.txt

      echo ""

      echo "OneDrive destination:"
      echo "Posted"

      echo ""
      echo "Pipeline:"
      echo "Pending_Posts"
      echo "      ↓"
      echo "GitHub Actions"
      echo "      ↓"
      echo "Facebook Page"
      echo "      ↓"
      echo "Posted"

      echo ""
      echo "STATUS: SUCCESS"
      echo "=============================================="
```
