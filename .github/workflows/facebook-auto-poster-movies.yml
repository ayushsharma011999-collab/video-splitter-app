name: Facebook Auto Poster - Movies and Web Series

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

concurrency:
  group: facebook-auto-poster-movies
  cancel-in-progress: false

jobs:
  publish-next-video:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # STEP 1: Get Microsoft Graph Token
      # --------------------------------------------------
      - name: Get Microsoft Graph token
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -e

          echo "Getting Microsoft Graph token..."

          TOKEN_RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${CLIENT_ID}" \
            --data-urlencode "client_secret=${CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          echo "$TOKEN_RESPONSE" > token_response.json

          GRAPH_TOKEN=$(python -c "import json; print(json.load(open('token_response.json'))['access_token'])")

          if [ -z "$GRAPH_TOKEN" ]; then
            echo "ERROR: Microsoft Graph token was not generated."
            exit 1
          fi

          echo "GRAPH_TOKEN=$GRAPH_TOKEN" >> "$GITHUB_ENV"

          echo "Microsoft Graph token generated successfully."


      # --------------------------------------------------
      # STEP 2: List Movies Pending Posts
      # --------------------------------------------------
      - name: List Movies_Pending_Posts
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          echo "Checking Movies_Pending_Posts..."

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Pending_Posts:/children" \
            -o pending_list.json \
            -w "%{http_code}" \
            > pending_http_code.txt

          HTTP_CODE=$(cat pending_http_code.txt)

          echo "Microsoft Graph HTTP Status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Could not access Movies_Pending_Posts."
            cat pending_list.json
            exit 1
          fi

          echo "Movies_Pending_Posts accessed successfully."


      # --------------------------------------------------
      # STEP 3: Find Next Video
      # --------------------------------------------------
      - name: Find next movie video
        run: |
          set -e

          python <<'PY'
          import json
          import re
          import os

          with open("pending_list.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          items = data.get("value", [])

          videos = []

          for item in items:
              name = item.get("name", "")

              if not name.lower().endswith(".mp4"):
                  continue

              match = re.search(r"_clip_(\d+)\.mp4$", name, re.IGNORECASE)

              if match:
                  clip_number = int(match.group(1))
                  videos.append((clip_number, name, item))

          if not videos:
              print("No movie video found in Movies_Pending_Posts.")
              open("NO_VIDEO", "w").close()
              raise SystemExit(0)

          videos.sort(key=lambda x: x[0])

          clip_number, video_name, video_item = videos[0]

          print(f"Selected video: {video_name}")
          print(f"Clip number: {clip_number}")

          with open("selected_video.json", "w", encoding="utf-8") as f:
              json.dump(video_item, f, indent=2)

          with open("SELECTED_VIDEO_NAME", "w", encoding="utf-8") as f:
              f.write(video_name)

          with open("SELECTED_CLIP_NUMBER", "w", encoding="utf-8") as f:
              f.write(str(clip_number))
          PY

          if [ -f "NO_VIDEO" ]; then
            echo "Nothing to post."
            exit 0
          fi


      # --------------------------------------------------
      # STEP 4: Find Matching Metadata
      # --------------------------------------------------
      - name: Find matching metadata
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          VIDEO_NAME=$(cat SELECTED_VIDEO_NAME)

          BASE_NAME="${VIDEO_NAME%_clip_*.mp4}"

          METADATA_NAME="${BASE_NAME}_metadata.json"

          echo "Video: ${VIDEO_NAME}"
          echo "Metadata: ${METADATA_NAME}"

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Pending_Posts:/children" \
            -o metadata_list.json

          python <<'PY'
          import json
          import os
          import sys

          video_name = open("SELECTED_VIDEO_NAME", encoding="utf-8").read().strip()

          base_name = video_name.rsplit("_clip_", 1)[0]

          expected = base_name + "_metadata.json"

          with open("metadata_list.json", encoding="utf-8") as f:
              data = json.load(f)

          found = None

          for item in data.get("value", []):
              if item.get("name") == expected:
                  found = item
                  break

          if not found:
              print(f"ERROR: Metadata file not found: {expected}")
              sys.exit(1)

          with open("selected_metadata.json", "w", encoding="utf-8") as f:
              json.dump(found, f, indent=2)

          print(f"Metadata found: {expected}")
          PY


      # --------------------------------------------------
      # STEP 5: Download Metadata
      # --------------------------------------------------
      - name: Download metadata
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          METADATA_ID=$(python -c "import json; print(json.load(open('selected_metadata.json'))['id'])")

          echo "Downloading metadata..."

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/${METADATA_ID}/content" \
            -o metadata.json

          echo "Metadata downloaded."


      # --------------------------------------------------
      # STEP 6: Create Caption
      # --------------------------------------------------
      - name: Create Facebook caption
        run: |
          set -e

          python <<'PY'
          import json

          with open("metadata.json", encoding="utf-8") as f:
              data = json.load(f)

          title = data.get("title", "")
          description = data.get("description", "")
          hashtags = data.get("hashtags", "")

          if isinstance(hashtags, list):
              hashtags = " ".join(str(x) for x in hashtags)

          caption_parts = []

          if title:
              caption_parts.append(str(title))

          if description:
              caption_parts.append(str(description))

          if hashtags:
              caption_parts.append(str(hashtags))

          caption = "\n\n".join(caption_parts).strip()

          if not caption:
              caption = "New movie/web series video 🎬"

          with open("caption.txt", "w", encoding="utf-8") as f:
              f.write(caption)

          print("Caption created:")
          print(caption)
          PY


      # --------------------------------------------------
      # STEP 7: Download Video
      # --------------------------------------------------
      - name: Download movie video
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          VIDEO_ID=$(python -c "import json; print(json.load(open('selected_video.json'))['id'])")

          echo "Downloading selected movie video..."

          curl -L -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/${VIDEO_ID}/content" \
            -o movie_video.mp4

          if [ ! -s movie_video.mp4 ]; then
            echo "ERROR: Video download failed."
            exit 1
          fi

          echo "Video downloaded successfully."

          ls -lh movie_video.mp4


      # --------------------------------------------------
      # STEP 8: Validate Facebook Secrets
      # --------------------------------------------------
      - name: Validate Facebook configuration
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.MOVIES_FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          if [ -z "$FACEBOOK_PAGE_ID" ]; then
            echo "ERROR: MOVIES_FACEBOOK_PAGE_ID secret is missing."
            exit 1
          fi

          if [ -z "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then
            echo "ERROR: MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN secret is missing."
            exit 1
          fi

          echo "Facebook Page configuration is available."


      # --------------------------------------------------
      # STEP 9: Upload Video to Facebook
      # --------------------------------------------------
      - name: Upload video to Movies and web series
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.MOVIES_FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: |
          set -e

          echo "Uploading video to Facebook..."

          RESPONSE=$(curl -sS -X POST \
            "https://graph.facebook.com/v23.0/${FACEBOOK_PAGE_ID}/videos" \
            -H "Authorization: Bearer ${FACEBOOK_PAGE_ACCESS_TOKEN}" \
            -F "source=@movie_video.mp4" \
            -F "description=<caption.txt")

          echo "$RESPONSE" > facebook_response.json

          echo "Facebook response:"
          cat facebook_response.json

          VIDEO_ID=$(python - <<'PY'
          import json

          with open("facebook_response.json", encoding="utf-8") as f:
              data = json.load(f)

          if "error" in data:
              print("FACEBOOK_ERROR")
          else:
              print(data.get("id", ""))
          PY
          )

          if [ "$VIDEO_ID" = "FACEBOOK_ERROR" ]; then
            echo "ERROR: Facebook rejected the video."
            exit 1
          fi

          if [ -z "$VIDEO_ID" ]; then
            echo "ERROR: Facebook did not return a video ID."
            exit 1
          fi

          echo "Facebook video posted successfully."
          echo "Facebook Video ID: ${VIDEO_ID}"


      # --------------------------------------------------
      # STEP 10: Find Movies_Posted Folder
      # --------------------------------------------------
      - name: Find Movies_Posted folder
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          curl -sS \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Posted:/children" \
            -o posted_folder_check.json

          HTTP_CODE=$(curl -sS -o /dev/null \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Posted:/children")

          echo "Movies_Posted HTTP Status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Movies_Posted folder exists."
          else
            echo "Movies_Posted folder does not exist."
            echo "Creating Movies_Posted folder..."

            curl -sS -X POST \
              -H "Authorization: Bearer ${GRAPH_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root/children" \
              -d '{
                "name": "Movies_Posted",
                "folder": {},
                "@microsoft.graph.conflictBehavior": "fail"
              }' \
              -o create_posted_response.json

            cat create_posted_response.json
          fi


      # --------------------------------------------------
      # STEP 11: Move Video to Movies_Posted
      # --------------------------------------------------
      - name: Move posted video to Movies_Posted
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          VIDEO_ID=$(python -c "import json; print(json.load(open('selected_video.json'))['id'])")

          echo "Moving video to Movies_Posted..."

          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/${VIDEO_ID}" \
            -d '{
              "parentReference": {
                "path": "/drive/root:/Movies_Posted"
              }
            }' \
            -o move_video_response.json

          echo "Move response:"
          cat move_video_response.json


      # --------------------------------------------------
      # STEP 12: Move Metadata to Movies_Posted
      # --------------------------------------------------
      - name: Move metadata to Movies_Posted
        env:
          GRAPH_TOKEN: ${{ env.GRAPH_TOKEN }}
        run: |
          set -e

          METADATA_ID=$(python -c "import json; print(json.load(open('selected_metadata.json'))['id'])")

          echo "Moving metadata to Movies_Posted..."

          curl -sS -X PATCH \
            -H "Authorization: Bearer ${GRAPH_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/${METADATA_ID}" \
            -d '{
              "parentReference": {
                "path": "/drive/root:/Movies_Posted"
              }
            }' \
            -o move_metadata_response.json

          echo "Metadata moved successfully."


      # --------------------------------------------------
      # STEP 13: Final Success
      # --------------------------------------------------
      - name: Final result
        run: |
          echo "=========================================="
          echo "MOVIES AUTO POST SUCCESSFUL"
          echo "=========================================="
          echo "Source folder : Movies_Pending_Posts"
          echo "Target folder : Movies_Posted"
          echo "Facebook Page  : Movies and web series"
          echo "Page ID        : 622325740963525"
          echo "=========================================="
