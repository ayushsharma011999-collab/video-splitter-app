name: Facebook Auto Poster - Movies and Web Series

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

concurrency:
  group: facebook-auto-poster-movies
  cancel-in-progress: false

jobs:
  publish-next-video:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Get Microsoft Graph Token
      # ==========================================================

      - name: Get Microsoft Graph Token
        id: graph_token
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          ACCESS_TOKEN=$(python -c '
          import json,sys
          data=json.loads(sys.stdin.read())
          print(data["access_token"])
          ' <<< "$RESPONSE")

          echo "::add-mask::$ACCESS_TOKEN"
          echo "GRAPH_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      # ==========================================================
      # 2. Get Movies_Pending_Posts folder
      # ==========================================================

      - name: Get Movies Pending Posts Folder
        id: pending_folder
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Pending_Posts")

          echo "$RESPONSE" > folder.json

          FOLDER_ID=$(python - <<'PY'
          import json

          with open("folder.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data["id"])
          PY
          )

          echo "FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"

      # ==========================================================
      # 3. List files
      # ==========================================================

      - name: List Pending Movie Files
        id: list_files
        shell: bash
        run: |
          set -e

          curl -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$FOLDER_ID/children" \
            > files.json

      # ==========================================================
      # 4. Select next video
      # ==========================================================

      - name: Select Next Movie Video
        id: video_select
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import re

          with open("files.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = []

          for item in data.get("value", []):
              name = item.get("name", "")

              if re.search(r"_clip_\d+\.mp4$", name, re.IGNORECASE):
                  videos.append(item)

          if not videos:
              print("No movie video found.")

              with open("video.env", "w") as f:
                  f.write("HAS_VIDEO=false\n")

          else:
              def clip_number(item):
                  match = re.search(
                      r"_clip_(\d+)\.mp4$",
                      item.get("name", ""),
                      re.IGNORECASE
                  )

                  return int(match.group(1)) if match else 999999

              videos.sort(key=clip_number)

              selected = videos[0]

              video_name = selected["name"]
              video_id = selected["id"]

              print(f"Selected video: {video_name}")

              with open("video.env", "w") as f:
                  f.write("HAS_VIDEO=true\n")
                  f.write(f"VIDEO_ID={video_id}\n")
                  f.write(f"VIDEO_NAME={video_name}\n")
          PY

          cat video.env >> "$GITHUB_ENV"

      # ==========================================================
      # 5. Stop gracefully if no video
      # ==========================================================

      - name: No Video Available
        if: env.HAS_VIDEO != 'true'
        run: |
          echo "No video available in Movies_Pending_Posts."
          echo "Workflow finished successfully."

      # ==========================================================
      # 6. Find metadata file
      # ==========================================================

      - name: Find Movie Metadata
        if: env.HAS_VIDEO == 'true'
        id: metadata
        shell: bash
        run: |
          set -e

          BASE_NAME="${VIDEO_NAME%_clip_*}"
          METADATA_NAME="${BASE_NAME}_metadata.json"

          echo "Looking for metadata:"
          echo "$METADATA_NAME"

          python - <<PY
          import json

          with open("files.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          target = "${METADATA_NAME}"

          metadata_id = ""

          for item in data.get("value", []):
              if item.get("name") == target:
                  metadata_id = item.get("id", "")
                  break

          with open("metadata.env", "w") as f:
              f.write(f"METADATA_ID={metadata_id}\n")
              f.write(f"METADATA_NAME={target}\n")

          if metadata_id:
              print("Metadata found.")
          else:
              print("Metadata not found.")
          PY

          cat metadata.env >> "$GITHUB_ENV"

      # ==========================================================
      # 7. Download metadata
      # ==========================================================

      - name: Download Movie Metadata
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          if [ -z "$METADATA_ID" ]; then
            echo "No metadata file found."
            echo '{}' > metadata.json
            exit 0
          fi

          curl -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$METADATA_ID/content" \
            -o metadata.json

          echo "Metadata file downloaded."

          if [ ! -s metadata.json ]; then
            echo "Metadata file is empty."
            echo '{}' > metadata.json
          fi

      # ==========================================================
      # 8. Create Facebook Caption
      # ==========================================================

      - name: Create Facebook caption
        if: env.HAS_VIDEO == 'true'
        id: caption
        shell: bash
        run: |
          set -e

          python - <<'PY'
          import json
          import os

          DEFAULT_CAPTION = "New movie/web series video 🎬"

          title = ""
          description = ""
          hashtags = ""

          try:
              if os.path.exists("metadata.json"):

                  with open(
                      "metadata.json",
                      "r",
                      encoding="utf-8"
                  ) as f:
                      raw = f.read().strip()

                  if raw:

                      try:
                          data = json.loads(raw)

                          if isinstance(data, dict):
                              title = str(
                                  data.get("title", "") or ""
                              ).strip()

                              description = str(
                                  data.get("description", "") or ""
                              ).strip()

                              hashtags = str(
                                  data.get("hashtags", "") or ""
                              ).strip()

                      except json.JSONDecodeError:
                          print(
                              "Metadata is not valid JSON."
                              " Using default caption."
                          )

          except Exception as e:
              print(
                  f"Metadata read error: {e}"
              )

          parts = []

          if title:
              parts.append(title)

          if description:
              parts.append(description)

          if hashtags:
              parts.append(hashtags)

          caption = "\n\n".join(parts).strip()

          if not caption:
              caption = DEFAULT_CAPTION

          print("Final caption:")
          print(caption)

          with open(
              "caption.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(caption)

          with open(
              "caption.env",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("CAPTION_READY=true\n")
          PY

          cat caption.env >> "$GITHUB_ENV"

      # ==========================================================
      # 9. Download Video
      # ==========================================================

      - name: Download Movie Video
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          curl -L -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$VIDEO_ID/content" \
            -o video.mp4

          if [ ! -s video.mp4 ]; then
            echo "Video download failed or file is empty."
            exit 1
          fi

          ls -lh video.mp4

      # ==========================================================
      # 10. Upload Video to Facebook
      # ==========================================================

      - name: Upload Video to Movies Facebook Page
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          if [ -z "${{ secrets.MOVIES_FACEBOOK_PAGE_ID }}" ]; then
            echo "MOVIES_FACEBOOK_PAGE_ID is missing."
            exit 1
          fi

          if [ -z "${{ secrets.MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN }}" ]; then
            echo "MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN is missing."
            exit 1
          fi

          echo "Uploading video to Movies and Web Series Facebook Page..."

          RESPONSE=$(curl -sS -X POST \
            "https://graph.facebook.com/v23.0/${{ secrets.MOVIES_FACEBOOK_PAGE_ID }}/videos" \
            -H "Authorization: Bearer ${{ secrets.MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN }}" \
            -F "source=@video.mp4" \
            -F "description=$(cat caption.txt)")

          echo "$RESPONSE" > facebook_response.json

          echo "Facebook response:"
          cat facebook_response.json

          python - <<'PY'
          import json

          with open(
              "facebook_response.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if "error" in data:
              print("Facebook API returned an error:")
              print(data["error"])
              raise SystemExit(1)

          if not data.get("id"):
              print("Facebook response did not contain a video ID.")
              raise SystemExit(1)

          print(
              "Facebook video posted successfully."
          )

          print(
              f"Facebook Video ID: {data['id']}"
          )
          PY

      # ==========================================================
      # 11. Find/Create Movies_Posted folder
      # ==========================================================

      - name: Find or Create Movies Posted Folder
        if: env.HAS_VIDEO == 'true'
        id: posted_folder
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Posted")

          if echo "$RESPONSE" | python -c '
          import json,sys
          d=json.load(sys.stdin)
          raise SystemExit(0 if d.get("id") else 1)
          '; then

            POSTED_FOLDER_ID=$(echo "$RESPONSE" | python -c '
            import json,sys
            print(json.load(sys.stdin)["id"])
            ')

          else

            CREATE_RESPONSE=$(curl -sS -X POST \
              -H "Authorization: Bearer $GRAPH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root/children" \
              -d '{
                "name": "Movies_Posted",
                "folder": {},
                "@microsoft.graph.conflictBehavior": "fail"
              }')

            POSTED_FOLDER_ID=$(echo "$CREATE_RESPONSE" | python -c '
            import json,sys
            print(json.load(sys.stdin)["id"])
            ')

          fi

          echo "POSTED_FOLDER_ID=$POSTED_FOLDER_ID" >> "$GITHUB_ENV"

      # ==========================================================
      # 12. Move Video to Movies_Posted
      # ==========================================================

      - name: Move Movie Video to Posted
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          curl -sS -X PATCH \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$VIDEO_ID" \
            -d "{
              \"parentReference\": {
                \"id\": \"$POSTED_FOLDER_ID\"
              }
            }" \
            > move_video_response.json

          echo "Video moved to Movies_Posted."

      # ==========================================================
      # 13. Move Metadata to Movies_Posted
      # ==========================================================

      - name: Move Movie Metadata to Posted
        if: env.HAS_VIDEO == 'true' && env.METADATA_ID != ''
        shell: bash
        run: |
          set -e

          curl -sS -X PATCH \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$METADATA_ID" \
            -d "{
              \"parentReference\": {
                \"id\": \"$POSTED_FOLDER_ID\"
              }
            }" \
            > move_metadata_response.json

          echo "Metadata moved to Movies_Posted."

      # ==========================================================
      # 14. Final Status
      # ==========================================================

      - name: Final Status
        shell: bash
        run: |
          if [ "$HAS_VIDEO" != "true" ]; then
            echo "=========================================="
            echo "No video available."
            echo "=========================================="
          else
            echo "=========================================="
            echo "Movies Facebook Auto Poster completed."
            echo "Video: $VIDEO_NAME"
            echo "Destination: Movies and Web Series"
            echo "=========================================="
          fi
