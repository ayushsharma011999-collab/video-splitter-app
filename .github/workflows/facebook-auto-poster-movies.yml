name: Facebook Auto Poster - Movies and Web Series

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

concurrency:
  group: facebook-auto-poster-movies
  cancel-in-progress: false

jobs:
  publish-next-video:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. GET MICROSOFT GRAPH TOKEN
      # ============================================================
      - name: Get Microsoft Graph Token
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -s -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          echo "$RESPONSE" > token_response.json

          python -c "import json; d=json.load(open('token_response.json')); print('Microsoft Graph token received successfully')"

          echo "GRAPH_TOKEN=$(python -c "import json; print(json.load(open('token_response.json'))['access_token'])")" >> "$GITHUB_ENV"


      # ============================================================
      # 2. FIND MOVIES PENDING FOLDER
      # ============================================================
      - name: Find Movies Pending Folder
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Pending_Posts")

          echo "$RESPONSE" > pending_folder.json

          python -c "import json; d=json.load(open('pending_folder.json')); print('Movies_Pending_Posts folder found:', d.get('id','NOT_FOUND'))"

          FOLDER_ID=$(python -c "import json; print(json.load(open('pending_folder.json'))['id'])")

          echo "MOVIES_PENDING_FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"


      # ============================================================
      # 3. LIST FILES
      # ============================================================
      - name: List Movies Pending Files
        shell: bash
        run: |
          set -e

          curl -s \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$MOVIES_PENDING_FOLDER_ID/children" \
            > pending_files.json

          python -c "import json; d=json.load(open('pending_files.json')); print('Files found:', len(d.get('value',[])))"


      # ============================================================
      # 4. SELECT NEXT VIDEO
      # ============================================================
      - name: Select Next Movie Video
        shell: bash
        run: |
          set -e

          VIDEO_INFO=$(python -c "import json,re; d=json.load(open('pending_files.json')); files=[x for x in d.get('value',[]) if x.get('file') and re.search(r'_clip_[0-9]+\.mp4$',x.get('name',''),re.I)]; files.sort(key=lambda x:int(re.search(r'_clip_([0-9]+)\.mp4$',x['name'],re.I).group(1))); print(files[0]['id']+'|'+files[0]['name'] if files else '')")

          if [ -z "$VIDEO_INFO" ]; then
            echo "No movie video available."
            echo "NO_VIDEO=true" >> "$GITHUB_ENV"
            exit 0
          fi

          VIDEO_ID="${VIDEO_INFO%%|*}"
          VIDEO_NAME="${VIDEO_INFO#*|}"

          echo "VIDEO_ID=$VIDEO_ID" >> "$GITHUB_ENV"
          echo "VIDEO_NAME=$VIDEO_NAME" >> "$GITHUB_ENV"

          echo "Selected video: $VIDEO_NAME"


      # ============================================================
      # 5. STOP IF NO VIDEO
      # ============================================================
      - name: Stop If No Video
        if: env.NO_VIDEO == 'true'
        run: |
          echo "Nothing to post."
          exit 0


      # ============================================================
      # 6. FIND MATCHING METADATA
      # ============================================================
      - name: Find Matching Metadata
        if: env.NO_VIDEO != 'true'
        shell: bash
        run: |
          set -e

          BASE_NAME="${VIDEO_NAME%.*}"
          METADATA_NAME="${BASE_NAME%_clip_*}_metadata.json"

          echo "Looking for metadata: $METADATA_NAME"

          METADATA_INFO=$(python -c "import json; d=json.load(open('pending_files.json')); name='$METADATA_NAME'; f=next((x for x in d.get('value',[]) if x.get('name')==name),None); print((f.get('id','')+'|'+f.get('name','')) if f else '')")

          if [ -z "$METADATA_INFO" ]; then
            echo "Metadata not found."
            echo "NO_METADATA=true" >> "$GITHUB_ENV"
          else
            METADATA_ID="${METADATA_INFO%%|*}"
            METADATA_NAME_FOUND="${METADATA_INFO#*|}"

            echo "METADATA_ID=$METADATA_ID" >> "$GITHUB_ENV"
            echo "METADATA_NAME=$METADATA_NAME_FOUND" >> "$GITHUB_ENV"

            echo "Metadata found: $METADATA_NAME_FOUND"
          fi


      # ============================================================
      # 7. DOWNLOAD METADATA
      # ============================================================
      - name: Download Metadata
        if: env.NO_VIDEO != 'true'
        shell: bash
        run: |
          set -e

          if [ "${NO_METADATA:-false}" = "true" ]; then
            echo "{}" > metadata.json
            exit 0
          fi

          curl -s \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$METADATA_ID/content" \
            -o metadata.json

          if [ ! -s metadata.json ]; then
            echo "{}" > metadata.json
          fi

          python -c "import json; json.load(open('metadata.json')); print('Metadata JSON is valid')"


      # ============================================================
      # 8. CREATE FACEBOOK CAPTION WITH CLIP NUMBER
      # ============================================================
      - name: Create Facebook Caption
        if: env.NO_VIDEO != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import os

          # --------------------------------------------------------
          # Read metadata
          # --------------------------------------------------------
          try:
              with open("metadata.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              data = {}

          # --------------------------------------------------------
          # Get total clips
          # --------------------------------------------------------
          total_clips = data.get("total_clips", 0)

          try:
              total_clips = int(total_clips)
          except:
              total_clips = 0

          # --------------------------------------------------------
          # Get current clip number from filename
          # Example:
          # movie_clip_001.mp4 -> 1
          # movie_clip_002.mp4 -> 2
          # --------------------------------------------------------
          video_name = os.environ.get("VIDEO_NAME", "")

          match = re.search(
              r"_clip_([0-9]+)\.mp4$",
              video_name,
              re.IGNORECASE
          )

          if match:
              clip_number = int(match.group(1))
          else:
              clip_number = 1

          # --------------------------------------------------------
          # If metadata total is unavailable, use current clip number
          # --------------------------------------------------------
          if total_clips <= 0:
              total_clips = clip_number

          # --------------------------------------------------------
          # Existing caption data
          # --------------------------------------------------------
          title = str(data.get("title", "")).strip()

          description = str(
              data.get("description", "")
          ).strip()

          hashtags = data.get("hashtags", "")

          if isinstance(hashtags, list):
              hashtags = " ".join(str(x) for x in hashtags)
          else:
              hashtags = str(hashtags).strip()

          existing_caption = " ".join(
              x for x in [
                  title,
                  description,
                  hashtags
              ]
              if x
          )

          if not existing_caption:
              existing_caption = "New movie/web series video 🎬"

          # --------------------------------------------------------
          # NEW FACEBOOK CAPTION
          # --------------------------------------------------------
          caption = (
              f"🎬 Clip {clip_number}/{total_clips}\n\n"
              f"{existing_caption}\n\n"
              f"#Clip{clip_number}"
          )

          with open(
              "caption.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(caption)

          print("=========================================")
          print("Facebook Caption Created")
          print("=========================================")
          print(f"Video: {video_name}")
          print(f"Clip Number: {clip_number}")
          print(f"Total Clips: {total_clips}")
          print("-----------------------------------------")
          print(caption)
          print("=========================================")
          PY


      # ============================================================
      # 9. DOWNLOAD VIDEO
      # ============================================================
      - name: Download Video
        if: env.NO_VIDEO != 'true'
        shell: bash
        run: |
          set -e

          curl -L \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$VIDEO_ID/content" \
            -o video.mp4

          ls -lh video.mp4


      # ============================================================
      # 10. POST VIDEO TO FACEBOOK
      # ============================================================
      - name: Post Video To Movies Facebook Page
        if: env.NO_VIDEO != 'true'
        shell: bash
        run: |
          set -e

          CAPTION=$(cat caption.txt)

          RESPONSE=$(curl -s -X POST \
            "https://graph.facebook.com/v23.0/${{ secrets.MOVIES_FACEBOOK_PAGE_ID }}/videos" \
            -H "Authorization: Bearer ${{ secrets.MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN }}" \
            -F "source=@video.mp4" \
            --form-string "description=$CAPTION")

          echo "$RESPONSE" > facebook_response.json

          echo "Facebook response:"
          cat facebook_response.json

          VIDEO_FB_ID=$(python -c "import json; d=json.load(open('facebook_response.json')); print(d.get('id',''))")

          if [ -z "$VIDEO_FB_ID" ]; then
            echo "Facebook upload failed."
            exit 1
          fi

          echo "FACEBOOK_VIDEO_ID=$VIDEO_FB_ID" >> "$GITHUB_ENV"

          echo "Facebook video posted successfully."
          echo "Facebook Video ID: $VIDEO_FB_ID"


      # ============================================================
      # 11. FIND OR CREATE MOVIES POSTED FOLDER
      # ============================================================
      - name: Find Or Create Movies Posted Folder
        if: env.NO_VIDEO != 'true'
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Posted")

          echo "$RESPONSE" > posted_folder.json

          POSTED_FOLDER_ID=$(python -c "import json; d=json.load(open('posted_folder.json')); print(d.get('id',''))")

          if [ -n "$POSTED_FOLDER_ID" ]; then
            echo "Movies_Posted folder found."
          else
            echo "Movies_Posted folder not found. Creating it..."

            RESPONSE=$(curl -s -X POST \
              "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$MOVIES_PENDING_FOLDER_ID/children" \
              -H "Authorization: Bearer $GRAPH_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"Movies_Posted","folder":{},"@microsoft.graph.conflictBehavior":"fail"}')

            echo "$RESPONSE" > posted_folder.json

            POSTED_FOLDER_ID=$(python -c "import json; d=json.load(open('posted_folder.json')); print(d.get('id',''))")

            if [ -z "$POSTED_FOLDER_ID" ]; then
              echo "Failed to create Movies_Posted folder."
              cat posted_folder.json
              exit 1
            fi
          fi

          echo "MOVIES_POSTED_FOLDER_ID=$POSTED_FOLDER_ID" >> "$GITHUB_ENV"


      # ============================================================
      # 12. MOVE VIDEO TO MOVIES_POSTED
      # ============================================================
      - name: Move Video To Movies Posted
        if: env.NO_VIDEO != 'true'
        shell: bash
        run: |
          set -e

          curl -s -X PATCH \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$VIDEO_ID" \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"parentReference\":{\"id\":\"$MOVIES_POSTED_FOLDER_ID\"}}" \
            > move_video_response.json

          python -c "import json; d=json.load(open('move_video_response.json')); print('Video moved successfully:',d.get('name',''))"


      # ============================================================
      # 13. MOVE METADATA TO MOVIES_POSTED
      # ============================================================
      - name: Move Metadata To Movies Posted
        if: env.NO_VIDEO != 'true' && env.NO_METADATA != 'true'
        shell: bash
        run: |
          set -e

          curl -s -X PATCH \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$METADATA_ID" \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"parentReference\":{\"id\":\"$MOVIES_POSTED_FOLDER_ID\"}}" \
            > move_metadata_response.json

          python -c "import json; d=json.load(open('move_metadata_response.json')); print('Metadata moved successfully:',d.get('name',''))"


      # ============================================================
      # 14. FINAL STATUS
      # ============================================================
      - name: Final Status
        if: env.NO_VIDEO != 'true'
        run: |
          echo "========================================="
          echo "MOVIES AUTO POST COMPLETED"
          echo "========================================="
          echo "Video: $VIDEO_NAME"
          echo "Facebook Video ID: $FACEBOOK_VIDEO_ID"
          echo "Destination: Movies_Posted"
          echo "========================================="
