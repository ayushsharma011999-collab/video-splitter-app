name: Facebook Auto Poster - Movies and Web Series

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

concurrency:
  group: facebook-auto-poster-movies
  cancel-in-progress: false

jobs:
  publish-next-video:
    runs-on: ubuntu-latest

    steps:

      - name: Get Microsoft Graph Token
        id: graph_token
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${{ secrets.AZURE_TENANT_ID }}/oauth2/v2.0/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$RESPONSE" | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")

          echo "::add-mask::$ACCESS_TOKEN"
          echo "GRAPH_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          echo "Microsoft Graph token created."


      - name: Get Movies Pending Folder
        shell: bash
        run: |
          set -e

          curl -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Pending_Posts" \
            > pending_folder.json

          FOLDER_ID=$(python -c "import json; print(json.load(open('pending_folder.json'))['id'])")

          echo "FOLDER_ID=$FOLDER_ID" >> "$GITHUB_ENV"

          echo "Movies_Pending_Posts found."


      - name: List Movies Pending Files
        shell: bash
        run: |
          set -e

          curl -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$FOLDER_ID/children" \
            > files.json

          echo "Files retrieved."


      - name: Select Next Movie Video
        id: video_select
        shell: bash
        run: |
          set -e

          python <<'PY'
          import json
          import re

          with open("files.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          videos = []

          for item in data.get("value", []):
              name = item.get("name", "")

              if re.search(r"_clip_\d+\.mp4$", name, re.IGNORECASE):
                  videos.append(item)

          if not videos:
              print("No movie video found.")

              with open("video.env", "w") as f:
                  f.write("HAS_VIDEO=false\n")

          else:
              def clip_number(item):
                  match = re.search(
                      r"_clip_(\d+)\.mp4$",
                      item.get("name", ""),
                      re.IGNORECASE
                  )

                  return int(match.group(1)) if match else 999999

              videos.sort(key=clip_number)

              selected = videos[0]

              with open("video.env", "w") as f:
                  f.write("HAS_VIDEO=true\n")
                  f.write(f"VIDEO_ID={selected['id']}\n")
                  f.write(f"VIDEO_NAME={selected['name']}\n")

              print("Selected video:", selected["name"])
          PY

          cat video.env >> "$GITHUB_ENV"


      - name: Stop If No Video
        if: env.HAS_VIDEO != 'true'
        shell: bash
        run: |
          echo "No video available in Movies_Pending_Posts."
          echo "Workflow finished successfully."


      - name: Find Movie Metadata
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          BASE_NAME="${VIDEO_NAME%_clip_*}"
          METADATA_NAME="${BASE_NAME}_metadata.json"

          echo "Looking for: $METADATA_NAME"

          python <<PY
          import json

          with open("files.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          target = "${METADATA_NAME}"
          metadata_id = ""

          for item in data.get("value", []):
              if item.get("name") == target:
                  metadata_id = item.get("id", "")
                  break

          with open("metadata.env", "w") as f:
              f.write(f"METADATA_ID={metadata_id}\n")
              f.write(f"METADATA_NAME={target}\n")

          if metadata_id:
              print("Metadata found.")
          else:
              print("Metadata not found. Default caption will be used.")
          PY

          cat metadata.env >> "$GITHUB_ENV"


      - name: Download Movie Metadata
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          if [ -z "$METADATA_ID" ]; then
            echo "{}" > metadata.json
            echo "No metadata file."
            exit 0
          fi

          curl -L -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$METADATA_ID/content" \
            -o metadata.json

          if [ ! -s metadata.json ]; then
            echo "{}" > metadata.json
          fi

          echo "Metadata downloaded."


      - name: Create Facebook Caption
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          python <<'PY'
          import json
          import os

          caption = "New movie/web series video 🎬"

          try:
              with open("metadata.json", "r", encoding="utf-8") as f:
                  raw = f.read().strip()

              if raw:
                  data = json.loads(raw)

                  if isinstance(data, dict):

                      parts = []

                      title = str(data.get("title", "") or "").strip()
                      description = str(data.get("description", "") or "").strip()
                      hashtags = str(data.get("hashtags", "") or "").strip()

                      if title:
                          parts.append(title)

                      if description:
                          parts.append(description)

                      if hashtags:
                          parts.append(hashtags)

                      if parts:
                          caption = "\n\n".join(parts)

          except Exception as e:
              print("Metadata problem:", e)
              print("Using default caption.")

          print("Final caption:")
          print(caption)

          with open("caption.txt", "w", encoding="utf-8") as f:
              f.write(caption)
          PY


      - name: Download Movie Video
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          curl -L -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$VIDEO_ID/content" \
            -o video.mp4

          if [ ! -s video.mp4 ]; then
            echo "Video download failed."
            exit 1
          fi

          echo "Video downloaded successfully."


      - name: Upload Video to Movies Facebook Page
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          echo "Uploading video to Movies and Web Series Facebook Page..."

          RESPONSE=$(curl -sS -X POST \
            "https://graph.facebook.com/v23.0/${{ secrets.MOVIES_FACEBOOK_PAGE_ID }}/videos" \
            -H "Authorization: Bearer ${{ secrets.MOVIES_FACEBOOK_PAGE_ACCESS_TOKEN }}" \
            -F "source=@video.mp4" \
            -F "description=$(cat caption.txt)")

          echo "$RESPONSE" > facebook_response.json

          cat facebook_response.json

          python -c "import json; d=json.load(open('facebook_response.json')); assert 'error' not in d, d.get('error'); assert d.get('id'), 'Facebook video ID missing'; print('Facebook video posted successfully:', d['id'])"


      - name: Find Or Create Movies Posted Folder
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root:/Movies_Posted")

          POSTED_FOLDER_ID=$(echo "$RESPONSE" | python -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))")

          if [ -n "$POSTED_FOLDER_ID" ]; then
            echo "Movies_Posted folder already exists."
          else
            echo "Creating Movies_Posted folder..."

            CREATE_RESPONSE=$(curl -sS -X POST \
              -H "Authorization: Bearer $GRAPH_TOKEN" \
              -H "Content-Type: application/json" \
              "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/root/children" \
              -d '{"name":"Movies_Posted","folder":{},"@microsoft.graph.conflictBehavior":"fail"}')

            POSTED_FOLDER_ID=$(echo "$CREATE_RESPONSE" | python -c "import json,sys; d=json.load(sys.stdin); print(d['id'])")
          fi

          echo "POSTED_FOLDER_ID=$POSTED_FOLDER_ID" >> "$GITHUB_ENV"


      - name: Move Movie Video To Posted
        if: env.HAS_VIDEO == 'true'
        shell: bash
        run: |
          set -e

          curl -sS -X PATCH \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$VIDEO_ID" \
            -d "{\"parentReference\":{\"id\":\"$POSTED_FOLDER_ID\"}}" \
            > move_video.json

          echo "Video moved to Movies_Posted."


      - name: Move Movie Metadata To Posted
        if: env.HAS_VIDEO == 'true' && env.METADATA_ID != ''
        shell: bash
        run: |
          set -e

          curl -sS -X PATCH \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://graph.microsoft.com/v1.0/users/my@011999.onmicrosoft.com/drive/items/$METADATA_ID" \
            -d "{\"parentReference\":{\"id\":\"$POSTED_FOLDER_ID\"}}" \
            > move_metadata.json

          echo "Metadata moved to Movies_Posted."


      - name: Final Status
        shell: bash
        run: |
          if [ "$HAS_VIDEO" = "true" ]; then
            echo "=========================================="
            echo "Movies Auto Poster completed successfully."
            echo "Video: $VIDEO_NAME"
            echo "Destination: Movies and Web Series"
            echo "Folder: Movies_Posted"
            echo "=========================================="
          else
            echo "=========================================="
            echo "No video available."
            echo "=========================================="
          fi
