name: Agent 1 - Ingest Scout

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: autonomous-agent-1-ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      PYTHONUNBUFFERED: "1"
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ONEDRIVE_USER: ${{ secrets.ONEDRIVE_USER }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg
        shell: bash
        run: |
          if command -v ffprobe >/dev/null 2>&1; then
            echo "ffprobe already available: $(ffprobe -version | head -n 1)"
          else
            sudo apt-get update
            sudo apt-get install -y ffmpeg
            echo "Installed: $(ffprobe -version | head -n 1)"
          fi

      - name: Install Agent 1 dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Preflight validation
        shell: bash
        run: |
          test -n "$AZURE_CLIENT_ID" || { echo "Missing AZURE_CLIENT_ID secret"; exit 1; }
          test -n "$AZURE_TENANT_ID" || { echo "Missing AZURE_TENANT_ID secret"; exit 1; }
          test -n "$AZURE_CLIENT_SECRET" || { echo "Missing AZURE_CLIENT_SECRET secret"; exit 1; }
          test -n "$ONEDRIVE_USER" || { echo "Missing ONEDRIVE_USER secret"; exit 1; }

          python -m json.tool config/config.json >/dev/null
          python -m compileall -q agents/agent_1_ingest shared
          python - <<'PY'
          import shutil
          import sys

          if shutil.which("ffprobe") is None:
              print("ERROR: ffprobe is not available on the runner.")
              sys.exit(1)

          print("Preflight OK")
          PY

      - name: Run Agent 1 - Ingest Scout
        run: |
          python agents/agent_1_ingest/ingest_scout.py
